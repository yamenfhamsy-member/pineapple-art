name: Pineapple Art Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          java-package: 'jdk'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set version from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build signed release APK + AAB (arm64-v8a)
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          bash ./gradlew assembleFossRelease bundleFossRelease --stacktrace

      - name: Sign APKs with release keystore
        run: |
          mkdir -p $RUNNER_TEMP/keystores
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/keystores/pineapple-art.jks
          APKSIGNER=$(echo $ANDROID_HOME/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            "$APKSIGNER" sign \
              --ks $RUNNER_TEMP/keystores/pineapple-art.jks \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "$apk" \
              "$apk"
          done
          rm -f $RUNNER_TEMP/keystores/pineapple-art.jks

      - name: Sign AAB with release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/pineapple-art.jks
          for aab in app/build/outputs/bundle/fossRelease/*.aab; do
            jarsigner -verbose \
              -keystore $RUNNER_TEMP/pineapple-art.jks \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "$aab" "${{ secrets.ANDROID_KEY_ALIAS }}"
          done
          rm -f $RUNNER_TEMP/pineapple-art.jks

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/foss/release/*.apk dist/
          cp app/build/outputs/bundle/fossRelease/*.aab dist/
          ls -lh dist/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-release-apk
          path: dist/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-aab
          path: dist/*.aab

      - name: Attach to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          allowUpdates: true
