name: Pineapple Art Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build release APK + AAB (arm64-v8a)
        run: ./gradlew assembleFossRelease bundleFossRelease --stacktrace
      - name: Prepare release keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystores"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystores/pineapple-art.jks"
      - name: Sign release APKs
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            "$APKSIGNER" sign               --ks "$RUNNER_TEMP/keystores/pineapple-art.jks"               --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}"               --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"               --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}"               "$apk"
          done
      - name: Sign release AABs
        run: |
          for aab in app/build/outputs/bundle/fossRelease/*.aab; do
            jarsigner -keystore "$RUNNER_TEMP/keystores/pineapple-art.jks"               -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"               -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}"               "$aab" "${{ secrets.ANDROID_KEY_ALIAS }}"
          done
      - name: Collect artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          cp app/build/outputs/apk/foss/release/*.apk dist/
          cp app/build/outputs/bundle/fossRelease/*.aab dist/
          ls -lh dist/
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-release-apk-arm64
          path: dist/*.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-aab-arm64
          path: dist/*.aab
      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          allowUpdates: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystores/pineapple-art.jks"
