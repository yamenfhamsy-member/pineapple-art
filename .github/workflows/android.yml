name: Pineapple Art CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew :lib:palette:testFossDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew lintFossDebug --stacktrace
      - name: Build debug APK (arm64-v8a)
        run: ./gradlew assembleFossDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-debug-apk-arm64
          path: app/build/outputs/apk/foss/debug/*arm64-v8a*.apk
          if-no-files-found: error
