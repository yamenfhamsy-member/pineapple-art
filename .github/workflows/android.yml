name: Pineapple Art CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          java-package: 'jdk'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (existing suites only)
        run: bash ./gradlew :lib:palette:testDebugUnitTest --stacktrace

      - name: Android lint (fossDebug)
        run: bash ./gradlew lintFossDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-lint-reports
          path: "**/build/reports/lint-results-*.html"

      - name: Build debug APK (no secrets needed)
        run: bash ./gradlew assembleFossDebug --stacktrace

      - name: List built APKs
        run: find app/build/outputs/apk -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
