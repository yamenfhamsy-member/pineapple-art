name: Pineapple Art FOSS Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build FOSS APK (arm64-v8a)
        run: ./gradlew assembleFossRelease --stacktrace
      - name: Prepare keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystores"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystores/pineapple-art.jks"
      - name: Sign FOSS APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            "$APKSIGNER" sign               --ks "$RUNNER_TEMP/keystores/pineapple-art.jks"               --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}"               --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"               --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}"               "$apk"
          done
      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-art-foss-apk-arm64
          path: app/build/outputs/apk/foss/release/*.apk
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystores/pineapple-art.jks"
